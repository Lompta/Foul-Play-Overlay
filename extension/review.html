<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foul Play Review</title>
  <link rel="stylesheet" href="review.css">
</head>
<body>
  <header class="top">
    <h1>Foul Play <span>review the tape</span></h1>
    <div id="server" class="muted"></div>
  </header>
  <div class="layout">
    <nav id="list" aria-label="Your recorded battles"></nav>
    <main id="detail">
      <div class="empty">
        <p>Your finished Gen 9 Random Battles show up here, analyzed with the options you actually had on every turn.</p>
        <p class="muted">Recording happens quietly while you play. Nothing is analyzed or shown until a battle ends.</p>
      </div>
    </main>
  </div>
  <div id="tip" role="tooltip" hidden></div>
  <script src="review.js"></script>
</body>
</html>
